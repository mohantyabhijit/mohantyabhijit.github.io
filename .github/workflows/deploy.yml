# =============================================================================
# Cloudflare deployment for abhijitmohanty.com (active pipeline).
# -----------------------------------------------------------------------------
# Stage 1: build Hugo → GitHub Pages (staging preview). Unchanged.
# Stage 2: on manual approval, build Hugo → Cloudflare Pages (production) and
#          deploy the interactions/counter Worker (Workers + D1) in server-worker/.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  (Pages:Edit, D1:Edit, Workers Scripts:Edit,
#                          Workers Routes:Edit)
#   CLOUDFLARE_ACCOUNT_ID
#
# Infra already provisioned: Pages project `abhijitmohanty`, D1 `blog-interactions`
# (id in server-worker/wrangler.toml), Worker route `abhijitmohanty.com/api/*`.
# The old rsync/systemd-to-DigitalOcean deploy has been replaced; the droplet is
# no longer part of the blog's production path.
# =============================================================================

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Permissions for the GitHub Pages staging stage.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Stage 1: Build Hugo and deploy to GitHub Pages (staging, automatic)
  # Unchanged from the old pipeline.
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Build site for GitHub Pages (staging preview)
        run: hugo --minify --baseURL "https://mohantyabhijit.github.io/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------
  # Stage 2: Deploy the static site to Cloudflare Pages (production)
  # Gated behind manual approval via the `production` environment,
  # matching the old behaviour.
  # ------------------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-pages
    if: github.event_name == 'push'
    environment:
      name: production
      url: https://abhijitmohanty.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Build site for production
        run: hugo --minify --baseURL "https://abhijitmohanty.com/"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.166.0 pages deploy public --project-name=abhijitmohanty --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy interactions + counter Worker (D1)
        run: npx --yes wrangler@4.166.0 deploy
        working-directory: server-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ------------------------------------------------------------------
  # Manual production deploy (workflow_dispatch) — used when we
  # intentionally skip the GitHub Pages stage.
  # ------------------------------------------------------------------
  deploy-production-manual:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://abhijitmohanty.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Build site for production
        run: hugo --minify --baseURL "https://abhijitmohanty.com/"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.166.0 pages deploy public --project-name=abhijitmohanty --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy interactions + counter Worker (D1)
        run: npx --yes wrangler@4.166.0 deploy
        working-directory: server-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ------------------------------------------------------------------
  # The /api/interactions (likes + threaded comments) and /api/counter
  # (view counter) endpoints are served by the Worker in server-worker/,
  # deployed by the "Deploy interactions + counter Worker (D1)" step above.
  # Keep the URL paths identical so the inlined front-end JS needs no
  # change. See server-worker/README.md for D1 creation, schema and data
  # import. Set database_id in server-worker/wrangler.toml before flipping.
  # ------------------------------------------------------------------
